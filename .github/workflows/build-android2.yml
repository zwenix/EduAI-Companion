name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#060b18' \
            --iconBackgroundColorDark '#060b18' \
            --splashBackgroundColor '#060b18' \
            --splashBackgroundColorDark '#060b18'

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Wire Google Sign-In native config
        run: node scripts/wire-google-signin.mjs

      - name: Use stable debug keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          cp signing/android-debug.keystore ~/.android/debug.keystore

      - name: Print Google Sign-In registration fingerprints
        run: |
          echo "=== Google Cloud Console → Credentials → OAuth client ID (type: Android) ==="
          echo "Package name: com.eduaicompanion.app"

          keytool -list \
            -v \
            -keystore signing/android-debug.keystore \
            -storepass android \
            -alias androiddebugkey 2>/dev/null |
            grep -E "SHA1:|SHA256:" || true

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail

          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_APK="android/app/build/outputs/apk/debug/EduAI-Companion.apk"

          test -f "$SOURCE_APK"
          mv "$SOURCE_APK" "$OUTPUT_APK"
          test -f "$OUTPUT_APK"

          echo "APK created at: $OUTPUT_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduAI-Companion-apk
          path: android/app/build/outputs/apk/debug/EduAI-Companion.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHA1="$(
            keytool -list \
              -v \
              -keystore signing/android-debug.keystore \
              -storepass android \
              -alias androiddebugkey 2>/dev/null |
              awk -F': ' '/SHA1:/{print $2; exit}' |
              tr -d '[:space:]'
          )"

          SHA256="$(
            keytool -list \
              -v \
              -keystore signing/android-debug.keystore \
              -storepass android \
              -alias androiddebugkey 2>/dev/null |
              awk -F': ' '/SHA256:/{print $2; exit}' |
              tr -d '[:space:]'
          )"

          cat > release-notes.md <<EOF
          Automatically built Android APK from commit ${{ github.sha }}.

          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Google Sign-In registration

          Register an OAuth client ID of type "Android" in the same Google Cloud
          project as the web client ID.

          - Package name: \`com.eduaicompanion.app\`
          - SHA-1: \`${SHA1}\`
          - SHA-256: \`${SHA256}\`

          Google Cloud project number: \`725068822716\`
          EOF

          gh release create "apk-${{ github.run_id }}" \
            android/app/build/outputs/apk/debug/EduAI-Companion.apk \
            --title "EduAI Companion APK (build ${{ github.run_number }})" \
            --notes-file release-notes.md

      - name: Publish APK to apk-artifacts branch
        run: |
          set -euo pipefail

          APK_PATH="android/app/build/outputs/apk/debug/EduAI-Companion.apk"
          test -f "$APK_PATH"

          cp "$APK_PATH" /tmp/EduAI-Companion.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan apk-artifacts
          git rm -rfq . || true

          mkdir -p apk
          cp /tmp/EduAI-Companion.apk apk/EduAI-Companion.apk

          git add -f apk/EduAI-Companion.apk
          git commit -m "build: EduAI Companion APK ${GITHUB_SHA::8}" \
            || echo "No changes to commit"

          git push -f origin apk-artifacts
