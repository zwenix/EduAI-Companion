name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android
        
      - name: Generate app icons & splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#060b18' --iconBackgroundColorDark '#060b18' --splashBackgroundColor '#060b18' --splashBackgroundColorDark '#060b18' --logoSplashScale 0.4
      
      - name: Sync web assets to Android
        run: npx cap sync android
        
      - name: Use stable debug keystore
        run: mkdir -p ~/.android && cp signing/android-debug.keystore ~/.android/debug.keystore

      - name: Assemble debug APK (auto-signed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduAI-Companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Automatically built Android APK from commit ${{ github.sha }}.

          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          gh release create "apk-${{ github.run_id }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "EduAI Companion APK (build ${{ github.run_number }})" \
            --notes-file release-notes.md

      - name: Publish APK to apk-artifacts branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan apk-artifacts
          git rm -rfq . || true
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/EduAI-Companion.apk
          git add -f apk/EduAI-Companion.apk
          git commit -m "build: EduAI Companion APK ${GITHUB_SHA::8}" || echo "no changes to commit"
          git push -f origin apk-artifacts
