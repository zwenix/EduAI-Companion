# ⚠️ TEMPLATE — intended content of .github/workflows/ci.yml
#
# WHY THIS IS A TEMPLATE
# ----------------------
# The Arena GitHub App token cannot push edits to `.github/workflows/*`
# ("refusing to allow a GitHub App to create or update workflow … without
# `workflows` permission"), so this wiring cannot land through a pull request.
# The Android release workflow is delivered the same way — see
# `docs/build-android2.workflow.yml`.
#
# TO APPLY (one paste, ~1 minute, no terminal needed):
#   1. Open https://github.com/zwenix/EduAI-Companion/new/main/.github/workflows/ci.yml
#      (or: repo → Add file → Create new file → path `.github/workflows/ci.yml`)
#   2. Select all, paste everything below the "=== BEGIN WORKFLOW ===" marker.
#   3. Commit directly to `main`.
#
# ALTERNATIVE: run the identical pipeline locally at any time with `npm run ci`
# (see `scripts/ci.sh`) — the workflow below simply calls that script.
#
# WHAT IT DOES
#   • Runs on every pull request and every push to main.
#   • Secret scan  → type check → unit tests → content-template contract → build.
#   • Uploads the JUnit test report as a build artifact (always).
#   • Uploads the production bundle for 7 days when main is green.
#
# === BEGIN WORKFLOW ===

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Secret scan runs FIRST and on its own so a leaked credential fails the
      # run even if the dependency install is broken.
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test
        env:
          CI: 'true'

      - name: Content template contract
        run: npm run verify:template

      - name: Production build
        run: npm run build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production bundle
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
