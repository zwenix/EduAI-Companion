# ⚠️ TEMPLATE — intended content of .github/workflows/build-android2.yml
#
# The assistant's GitHub App token cannot push edits to .github/workflows/*
# ("refusing to allow a GitHub App to create or update workflow … without
# `workflows` permission"), which is why this wiring never landed through PRs.
#
# To apply (one paste, ~1 minute, no terminal needed):
#   1. Open https://github.com/zwenix/EduAI-Companion/edit/main/.github/workflows/build-android2.yml
#   2. Select all, replace with this file's content, commit directly to main.
#   3. GitHub Actions immediately cuts a new release build.
#
# Differences from the current workflow:
#   • NEW step "Wire Google Sign-In native config" right after
#     "Sync web assets to Android" — installs google-services.json into
#     android/app/ (activates the google-services Gradle plugin that the
#     generated build.gradle applies conditionally) and patches strings.xml
#     server_client_id with the Web client ID from src/config/googleAuth.ts,
#     so the ID token always uses the Web client as audience.
#   • The GitHub Release asset is uploaded as EduAI-Companion.apk (it was
#     app-debug.apk; the apk-artifacts branch copy was already named
#     EduAI-Companion.apk).

name: Build & Release Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons & splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#060b18' --iconBackgroundColorDark '#060b18' --splashBackgroundColor '#060b18' --splashBackgroundColorDark '#060b18' --logoSplashScale 0.4

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Wire Google Sign-In native config
        run: node scripts/wire-google-signin.mjs

      - name: Use stable debug keystore
        run: mkdir -p ~/.android && cp signing/android-debug.keystore ~/.android/debug.keystore
      - name: Print Google Sign-In registration fingerprints
        run: |
          echo "=== Google Cloud Console → Credentials → OAuth client ID (type: Android) ==="
          echo "Package name: com.eduaicompanion.app"
          keytool -list -v -keystore signing/android-debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
      - name: Assemble debug APK (auto-signed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduAI-Companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Automatically built Android APK from commit ${{ github.sha }}.
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          ## Google Sign-In registration (required once in Google Cloud Console)
          Register an OAuth client ID of type "Android" with:
          - Package name: com.eduaicompanion.app
          EOF
          echo "- SHA-1: \`$(keytool -list -v -keystore signing/android-debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep 'SHA1:' | sed 's/^.*: //' | tr -d '[:space:]')\`" >> release-notes.md
          echo "- SHA-256: \`$(keytool -list -v -keystore signing/android-debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep 'SHA256:' | sed 's/^.*: //' | tr -d '[:space:]')\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "It must be created in the same GCP project as the web client ID (project number 725068822716)." >> release-notes.md
          cp android/app/build/outputs/apk/debug/app-debug.apk EduAI-Companion.apk
          gh release create "apk-${{ github.run_id }}" \
            EduAI-Companion.apk \
            --title "EduAI Companion APK (build ${{ github.run_number }})" \
            --notes-file release-notes.md
      - name: Publish APK to apk-artifacts branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan apk-artifacts
          git rm -rfq . || true
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/EduAI-Companion.apk
          git add -f apk/EduAI-Companion.apk
          git commit -m "build: EduAI Companion APK ${GITHUB_SHA::8}" || echo "no changes to commit"
          git push -f origin apk-artifacts
